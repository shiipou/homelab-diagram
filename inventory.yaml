meta:
  title: "My Homelab"
  title_redacted: "My Homelab"
  date: "November 2026"
  watermark: ""

network:
  subnet: "172.26.0.0/16"
  gateway: "172.26.0.1"
  note: "OpenWrt LAN · Kubernetes"

kubernetes:
  name: "Talos Kubernetes"
  control_plane: "172.26.1.1xx"
  workers: "172.26.1.2xx"

internet:
  primary: "Freebox Ultra"
  backup: "5G · unlimited data SIM"

freebox:
  name: "Freebox Ultra"
  type: "ISP router"
  model: "Freebox Ultra"
  ip: "192.168.10.254"
  os: "Freebox OS"
  link: "10G SFP+"

mochabin:
  name: "MochaBin 5G"
  type: "router"
  model: "5G modem · unlimited data SIM"
  wan: "192.168.10.245/24"
  lan: "172.26.0.1/16"
  os: "OpenWrt"
  ports:
    eth0: "Freebox Ultra · primary WAN"
    eth1: "Empty"
    eth2: "Netgear GS308 uplink"
    lan0: "LattePanda 1 · control plane"
    lan1: "LattePanda 2 · control plane"
    lan2: "Raspberry Pi 5 · control plane"
    lan3: "Storage Raspberry Pi"

switch:
  name: "Netgear GS308"
  type: "switch"
  model: "8-port Gigabit Ethernet"
  uplink: "MochaBin eth2"
  ports:
    - {port: 1, to: "HP Mini 1 · worker"}
    - {port: 2, to: "IBM dual-Xeon · worker"}
    - {port: 3, to: "Core i9-9900K · worker"}
    - {port: 4, to: "HP EliteDesk 800 G6 Mini · worker"}
    - {port: 5, to: "Free"}
    - {port: 6, to: "Free"}
    - {port: 7, to: "Free"}
    - {port: 8, to: "Free"}

nodes:
  - name: "LattePanda 1"
    role: "Control plane"
    model: "LattePanda 3 Delta"
    specs: ["16 GB RAM"]
    ip: "172.26.1.110"
    connection: "MochaBin lan0"
    group: "MochaBin direct"
  - name: "LattePanda 2"
    role: "Control plane"
    model: "LattePanda 3 Delta"
    specs: ["16 GB RAM"]
    ip: "172.26.1.111"
    connection: "MochaBin lan1"
    group: "MochaBin direct"
  - name: "Raspberry Pi 5"
    role: "Control plane"
    model: "Raspberry Pi 5"
    specs: ["8 GB RAM"]
    ip: "172.26.1.112"
    connection: "MochaBin lan2"
    group: "MochaBin direct"
  - name: "HP Mini 1"
    role: "Worker"
    model: "HP EliteDesk 800 G6 Mini · Core i5"
    specs: ["16 GB RAM"]
    ip: "172.26.1.201"
    connection: "GS308 port 1"
    group: "GS308"
  - name: "HP Mini 2"
    role: "Worker"
    model: "HP EliteDesk 800 G6 Mini · Core i5"
    specs: ["16 GB RAM"]
    ip: "172.26.1.202"
    connection: "GS308 port 4"
    group: "GS308"
  - name: "IBM server"
    role: "Worker"
    model: "IBM · dual Xeon"
    specs: ["196 GB RAM"]
    ip: "172.26.1.203"
    connection: "GS308 port 2"
    group: "GS308"
  - name: "GPU worker"
    role: "Worker"
    model: "Core i9-9900K"
    specs: ["64 GB RAM", "AMD Radeon RX 6900 XT · 16 GB VRAM", "Intel Arc A770 LE · 16 GB VRAM"]
    ip: "172.26.1.204"
    connection: "GS308 port 3"
    group: "GS308"

storage:
  name: "Raspberry Pi 5 · storage"
  model: "Raspberry Pi 5"
  specs: ["8 GB RAM"]
  connection: "MochaBin lan3"
  devices:
    - "4 × 2 TB SSDs · SSD rack"
    - "1 × 8 TB USB SSD"
    - "5-slot rack · 1 × 16 TB HDD installed"

bgp:
  speaker: "Cilium BGP"
  vip_services:
    - {name: "Talos VIP", ip: "172.26.0.10"}
    - {name: "Kubernetes API VIP", ip: "172.26.0.11"}
    - {name: "Traefik VIP", ip: "172.26.0.12"}

port_forwards:
  - {port: "80", proto: "TCP", to: "Traefik VIP · 172.26.0.12", what: "HTTP"}
  - {port: "443", proto: "TCP", to: "Traefik VIP · 172.26.0.12", what: "HTTPS"}
